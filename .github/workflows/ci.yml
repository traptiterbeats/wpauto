name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wpe2e
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: zip, mysqli, curl
      - run: go vet ./...
      - run: go test -race ./...
      - name: WordPress install end-to-end (real PHP helper + MySQL)
        run: go test -v -count=1 -run TestHelperEndToEnd ./internal/wp/
        env:
          WPAUTO_E2E_DB: root:root@127.0.0.1:3306/wpe2e
