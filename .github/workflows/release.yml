name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go vet ./...
      - run: go test -race ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # A tag with a '-' (v0.15.0-beta.1, v1.0.0-rc.1) is a pre-release: GitHub's "latest
      # release" then skips it, so `wpauto update` and install.sh keep giving stable users only
      # stable releases. GoReleaser already marks it (prerelease: auto); this makes it certain.
      - name: Mark pre-release tags
        if: contains(github.ref_name, '-')
        run: gh release edit "$GITHUB_REF_NAME" --prerelease --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
